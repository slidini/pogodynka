App\Entity\City:
    properties:
        name:
            - NotBlank: { message: 'Podaj nazwe miasta', groups: ['new', 'edit'] }
            - Length: { min: 2, max: 255, minMessage: 'Nazwa musi mieć min. {{ limit }} znaki.', groups: ['new'] }
            - Length: { min: 3, max: 255, minMessage: 'Przy edycji nazwa musi miec min {{ limit }} znaki', groups: ['edit'] }
        country:
            - NotBlank: { message: 'Wybierz panstwo.', groups: ['new', 'edit'] }
            - Country: { groups: ['new', 'edit'] }
        latitude:
            - NotBlank: { groups: ['new', 'edit'] }
            - Range: { min: -90, max: 90, notInRangeMessage: 'Szerokosc musi być miedzy {{ min }} a {{ max }}.', groups: ['new', 'edit'] }
        longitude:
            - NotBlank: { groups: ['new', 'edit'] }
            - Range: { min: -180, max: 180, notInRangeMessage: 'Dlugosc musi byc miedzy {{ min }} a {{ max }}.', groups: ['new', 'edit'] }
